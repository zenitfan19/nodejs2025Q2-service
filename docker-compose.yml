services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.DB
    container_name: home-library-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
